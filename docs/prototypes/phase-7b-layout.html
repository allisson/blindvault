<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlindVault UX prototype</title>
    <style>
      /* Page chrome (not the app) */
      :root {
        --page-bg: #f4f4f5;
        --page-fg: #18181b;
        --page-muted: #52525b;
        --page-line: #e4e4e7;
        --page-card: #fff;
      }
      :root[data-page='dark'] {
        --page-bg: #111113;
        --page-fg: #f4f4f5;
        --page-muted: #a1a1aa;
        --page-line: #27272a;
        --page-card: #18181b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--page-fg);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: var(--page-card);
        border-bottom: 1px solid var(--page-line);
      }
      .top h1 {
        font-size: 16px;
        margin: 0;
      }
      .top .sub {
        color: var(--page-muted);
        font-size: 13px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--page-line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--page-fg);
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: var(--page-fg);
        color: var(--page-bg);
      }
      .parts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .parts span {
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--page-line);
        color: var(--page-muted);
      }
      .parts span.on {
        background: var(--page-fg);
        color: var(--page-bg);
        border-color: var(--page-fg);
      }
      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      section.sc {
        background: var(--page-card);
        border: 1px solid var(--page-line);
        border-radius: 12px;
        padding: 16px;
      }
      section.sc h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      section.sc ul.notes {
        margin: 6px 0 14px;
        padding-left: 18px;
        color: var(--page-muted);
      }
      section.sc ul.notes b {
        color: var(--page-fg);
        font-weight: 600;
      }
      .pair {
        display: grid;
        gap: 16px;
      }
      .pair.wide {
        grid-template-columns: minmax(0, 1fr);
      }
      .col {
        min-width: 0;
      }
      .pair.narrow {
        grid-template-columns: minmax(0, 1fr);
        max-width: 460px;
      }
      .col > h3 {
        margin: 0 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--page-muted);
      }
      .col img {
        width: 100%;
        display: block;
        border: 1px solid var(--page-line);
        border-radius: 10px;
      }
      .shot {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--page-line);
        border-radius: 10px;
      }
      .only-after .before {
        display: none;
      }
      .only-after .pair.narrow {
        max-width: 460px;
      }

      /* ===== App tokens: copied from apps/web/src/index.css (D231, D246) ===== */
      .app {
        --bv-surface: #fafafa;
        --bv-raised: #ffffff;
        --bv-subtle: #f4f4f5;
        --bv-fg: #18181b;
        --bv-muted: #52525b;
        --bv-line: #e4e4e7;
        --bv-control: #71717a;
        --bv-scrim: #09090b4d;
        --bv-shadow: #0000001a;
        --bv-edge: #00000000;
        --bv-danger: #b91c1c;
        --bv-danger-soft: #fef2f2;
        --bv-danger-text: #7f1d1d;
        --bv-warning: #b45309;
        --bv-warning-soft: #fef3c7;
        --bv-warning-text: #78350f;
        --bv-info: #0369a1;
        --bv-info-soft: #f0f9ff;
        --bv-info-text: #082f49;
        --bv-success: #047857;
        --a1: #dbeafe;
        --a1i: #1e3a8a;
        --a2: #dcfce7;
        --a2i: #14532d;
        --a3: #fef3c7;
        --a3i: #78350f;
        --a4: #fce7f3;
        --a4i: #831843;
        --a5: #ede9fe;
        --a5i: #4c1d95;
        --a6: #ccfbf1;
        --a6i: #134e4a;
        --bv-accent: #2563eb;
        --bv-accent-hover: #1d4ed8;
        --bv-accent-ink: #ffffff;
        --bv-accent-soft: #eff6ff;
        --bv-accent-text: #1d4ed8;
        --r-control: 0.375rem;
        --r-card: 0.75rem;
        --shadow: 0 1px 3px 0 var(--bv-shadow), 0 0 0 1px var(--bv-edge);
        color-scheme: light;
        position: relative;
        overflow: hidden;
        background: var(--bv-surface);
        color: var(--bv-fg);
        font:
          14px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .app[data-theme='dark'] {
        --bv-surface: #09090b;
        --bv-raised: #18181b;
        --bv-subtle: #27272a;
        --bv-fg: #f4f4f5;
        --bv-muted: #a1a1aa;
        --bv-line: #27272a;
        --bv-scrim: #0000008c;
        --bv-shadow: #00000000;
        --bv-edge: #27272aff;
        --bv-danger: #f87171;
        --bv-danger-soft: #450a0a;
        --bv-danger-text: #fee2e2;
        --bv-warning: #fbbf24;
        --bv-warning-soft: #451a03;
        --bv-warning-text: #fef3c7;
        --bv-info: #38bdf8;
        --bv-info-soft: #082f49;
        --bv-info-text: #f0f9ff;
        --bv-success: #34d399;
        --a1: #1e3a8a;
        --a1i: #dbeafe;
        --a2: #14532d;
        --a2i: #dcfce7;
        --a3: #78350f;
        --a3i: #fef3c7;
        --a4: #831843;
        --a4i: #fce7f3;
        --a5: #4c1d95;
        --a5i: #ede9fe;
        --a6: #134e4a;
        --a6i: #ccfbf1;
        --bv-accent: #60a5fa;
        --bv-accent-hover: #93c5fd;
        --bv-accent-ink: #09090b;
        --bv-accent-soft: #172554;
        --bv-accent-text: #93c5fd;
        color-scheme: dark;
      }
      .app button {
        font: inherit;
        color: inherit;
      }
      .app svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border-radius: var(--r-control);
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--bv-accent);
        color: var(--bv-accent-ink);
      }
      .btn.primary:hover {
        background: var(--bv-accent-hover);
      }
      .btn.secondary {
        border-color: var(--bv-line);
        background: var(--bv-raised);
      }
      .btn.quiet:hover,
      .icon-btn:hover {
        background: var(--bv-subtle);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: var(--r-control);
        border: 0;
        background: transparent;
        cursor: pointer;
        color: var(--bv-muted);
      }
      .icon-btn[aria-pressed='true'] {
        color: var(--bv-accent-text);
        background: var(--bv-accent-soft);
      }
      .icon-btn.sm {
        width: 30px;
        height: 30px;
      }

      /* Header */
      .hdr {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-bottom: 1px solid var(--bv-line);
        background: var(--bv-surface);
      }
      .brand {
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand .mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--bv-fg);
        color: var(--bv-surface);
        display: grid;
        place-items: center;
      }
      .brand .mark svg {
        width: 14px;
        height: 14px;
      }
      .badge-preview {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--bv-warning-soft);
        color: var(--bv-warning-text);
        border: 0;
        cursor: pointer;
      }
      .hdr .grow {
        flex: 1;
      }
      .popover {
        position: absolute;
        z-index: 20;
        width: 320px;
        padding: 12px;
        border-radius: var(--r-card);
        background: var(--bv-raised);
        box-shadow:
          0 8px 24px var(--bv-shadow),
          0 0 0 1px var(--bv-line);
        font-size: 13px;
      }
      .popover b {
        display: block;
        margin-bottom: 4px;
      }

      /* Danger strip */
      .strip {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 16px;
        background: var(--bv-danger-soft);
        color: var(--bv-danger-text);
        font-size: 13px;
        border-bottom: 1px solid var(--bv-line);
      }
      .strip svg {
        margin-top: 2px;
        color: var(--bv-danger);
      }
      .strip .txt {
        flex: 1;
        min-width: 0;
      }
      .strip .txt.clip {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .strip button {
        border: 0;
        background: transparent;
        color: inherit;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
        white-space: nowrap;
      }

      /* Shell */
      .shell {
        display: grid;
        grid-template-columns: 15rem 21rem 1fr;
        height: calc(100% - 56px - var(--strip-h, 37px));
      }
      .pane {
        min-height: 0;
        overflow: auto;
      }
      .pane + .pane {
        border-left: 1px solid var(--bv-line);
      }
      .nav {
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav .lbl {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bv-muted);
        padding: 12px 10px 4px;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: var(--r-control);
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .nav a .n {
        margin-left: auto;
        color: var(--bv-muted);
        font-size: 12px;
      }
      .nav a.on {
        background: var(--bv-accent-soft);
        color: var(--bv-accent-text);
        font-weight: 600;
      }
      .nav a.add {
        color: var(--bv-muted);
      }

      .listhead {
        padding: 14px 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: sticky;
        top: 0;
        background: var(--bv-surface);
        z-index: 2;
      }
      .listhead .row1 {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .listhead h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .listhead .count {
        color: var(--bv-muted);
        font-size: 13px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 10px;
        border: 1px solid var(--bv-line);
        border-radius: var(--r-control);
        background: var(--bv-raised);
        color: var(--bv-muted);
      }
      .search kbd {
        margin-left: auto;
        font:
          11px ui-monospace,
          monospace;
        border: 1px solid var(--bv-line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .pills {
        display: flex;
        gap: 6px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--bv-line);
        background: var(--bv-raised);
        cursor: pointer;
        font-size: 13px;
      }
      .pill.on {
        border-color: var(--bv-accent);
        background: var(--bv-accent-soft);
        color: var(--bv-accent-text);
      }
      .pill svg {
        width: 14px;
        height: 14px;
      }

      .reminder {
        margin: 4px 12px 8px;
        padding: 10px 12px;
        border-radius: var(--r-card);
        background: var(--bv-info-soft);
        color: var(--bv-info-text);
        font-size: 13px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 8px;
      }
      .reminder .acts {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
      }
      .reminder .btn {
        height: 28px;
        padding: 0 10px;
        font-size: 13px;
      }
      .reminder .btn.secondary {
        background: transparent;
        border-color: currentColor;
      }
      .reminder .x {
        color: inherit;
      }

      .rows {
        list-style: none;
        margin: 0;
        padding: 0 8px 12px;
      }
      .rows li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        border-radius: var(--r-card);
        cursor: pointer;
      }
      .rows li:hover {
        background: var(--bv-subtle);
      }
      .rows li.on {
        background: var(--bv-accent-soft);
      }
      .rows .t {
        font-weight: 550;
      }
      .rows .s {
        color: var(--bv-muted);
        font-size: 12.5px;
      }
      .rows .mid {
        flex: 1;
        min-width: 0;
      }
      .rows .mid > div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rows .icon-btn {
        opacity: 0;
      }
      .rows li:hover .icon-btn,
      .rows li.on .icon-btn {
        opacity: 1;
      }
      .letter {
        padding: 10px 16px 2px;
        font-size: 11px;
        font-weight: 600;
        color: var(--bv-muted);
      }

      .av {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 650;
        flex: none;
      }
      .av .tb {
        position: absolute;
        right: -4px;
        bottom: -4px;
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: var(--bv-raised);
        box-shadow: 0 0 0 1px var(--bv-line);
        display: grid;
        place-items: center;
        color: var(--bv-muted);
      }
      .av .tb svg {
        width: 11px;
        height: 11px;
      }
      .av.lg {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        font-size: 22px;
      }
      .av.lg .tb {
        width: 22px;
        height: 22px;
      }
      .av.lg .tb svg {
        width: 13px;
        height: 13px;
      }

      /* Detail */
      .detail {
        padding: 20px 28px 32px;
        max-width: 760px;
      }
      .dbar {
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }
      .dbar h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.015em;
        font-weight: 650;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--bv-subtle);
        color: var(--bv-muted);
      }
      .chip svg {
        width: 12px;
        height: 12px;
      }
      .chip.link {
        color: var(--bv-accent-text);
      }
      .dbar .acts {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .sect {
        margin-top: 22px;
      }
      .sect .lbl {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bv-muted);
        margin: 0 0 6px 2px;
      }
      .card {
        background: var(--bv-raised);
        border-radius: var(--r-card);
        box-shadow: var(--shadow);
        border: 1px solid var(--bv-line);
      }
      .app[data-theme='dark'] .card {
        border-color: transparent;
      }
      .frow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 8px 10px 14px;
        min-height: 58px;
      }
      .frow + .frow {
        border-top: 1px solid var(--bv-line);
      }
      .frow .k {
        font-size: 12px;
        color: var(--bv-muted);
      }
      .frow .v {
        font-size: 15px;
      }
      .frow .v.mono {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: 0.02em;
      }
      .frow .grow {
        flex: 1;
        min-width: 0;
      }
      .frow .v.link {
        color: var(--bv-accent-text);
      }
      .notes {
        padding: 12px 14px;
        white-space: pre-line;
        font-size: 14px;
      }
      .meta {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--bv-muted);
        font-size: 12.5px;
      }
      .meta a {
        color: var(--bv-accent-text);
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .copied {
        color: var(--bv-success) !important;
      }

      .toast {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 9px 14px;
        border-radius: 10px;
        background: var(--bv-fg);
        color: var(--bv-surface);
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 6px 20px #0003;
        z-index: 30;
      }

      /* Mobile */
      .m {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .m .hdr {
        padding: 0 8px 0 16px;
      }
      .m .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .m .listhead {
        padding: 12px 16px 8px;
      }
      .m .rows {
        padding: 0 4px 12px;
      }
      .m .rows li {
        padding: 10px 12px;
      }
      .tabbar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--bv-line);
        background: var(--bv-surface);
        height: 60px;
      }
      .tabbar a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 11px;
        color: var(--bv-muted);
        cursor: pointer;
      }
      .tabbar a.on {
        color: var(--bv-accent-text);
        font-weight: 600;
      }
      .tabbar svg {
        width: 20px;
        height: 20px;
      }
      .m .toast {
        bottom: 76px;
      }
      .m .detail {
        padding: 8px 16px 24px;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 4px;
        padding: 10px 0 4px;
      }
      .hero h1 {
        margin: 6px 0 0;
        font-size: 22px;
        font-weight: 650;
      }
      .hero .chips {
        justify-content: center;
      }
      .sheet-scrim {
        position: absolute;
        inset: 0;
        background: var(--bv-scrim);
        z-index: 40;
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 41;
        background: var(--bv-raised);
        border-radius: 16px 16px 0 0;
        padding: 8px 8px 20px;
        box-shadow: 0 -8px 30px #0003;
      }
      .sheet .grab {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--bv-line);
        margin: 4px auto 10px;
      }
      .sheet h3 {
        margin: 0 12px 6px;
        font-size: 15px;
      }
      .menu {
        position: absolute;
        right: 8px;
        top: 50px;
        z-index: 42;
        min-width: 190px;
        padding: 6px;
        border-radius: var(--r-card);

      const PARTS = ['Tela principal', 'Navegação e Settings', 'Aparência e editor', 'Wizards'];
      const SC = [SC1, SC2, SC3, SC4].flatMap((l, i) => l.map((x) => ({ ...x, part: i + 1 })));
      S.part = 1;
      S.spage.i = 'import';
      function render() {
        document.documentElement.dataset.page = S.theme;
        document
          .querySelectorAll('#parts button')
          .forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === S.part)));
        document.getElementById('main').innerHTML = SC.filter((sc) => sc.part === S.part)
          .map(
            (sc) => `<section class="sc" id="sc-${sc.id}">
    <h2>${sc.title}</h2><ul class="notes">${sc.notes.map((n) => `<li>${n}</li>`).join('')}</ul>
    <div class="pair ${sc.wide ? 'wide' : 'narrow'}">
      
      <div class="col after"><div class="shot" data-fit>${sc.render(sc.id)}</div></div>
    </div></section>`,
          )
          .join('');
        fit();
      }
      function fit() {
        document.querySelectorAll('[data-fit]').forEach((box) => {
          const app = box.firstElementChild;
          const w = parseFloat(app.style.width),
            h = parseFloat(app.style.height);
          const z = Math.min(1, box.clientWidth / w);
          app.style.zoom = z;
          box.style.height = h * z + 'px';
        });
      }
      let copyTimer;
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        const seg = e.target.closest('.seg button');
        if (seg) {
          S[seg.parentElement.id] =
            seg.parentElement.id === 'parts' ? Number(seg.dataset.v) : seg.dataset.v;
          seg.parentElement
            .querySelectorAll('button')
            .forEach((b) => b.setAttribute('aria-pressed', b === seg));
          render();
          return;
        }
        if (!el) {
          if (S.previewOpen || S.menu) {
            S.previewOpen = null;
            S.menu = null;
            render();
          }
          return;
        }
        const k = el.dataset.k,
          a = el.dataset.act;
        if (a === 'pwin') return;
        const sc = el.closest('section')?.id.slice(3);
        if (a === 'sel') S.sel = el.dataset.id;
        if (a === 'copy') {
          e.stopPropagation();
          S.copied = el.dataset.c;
          S.toast = sc;
          clearTimeout(copyTimer);
          copyTimer = setTimeout(() => {
            S.copied = null;
            S.toast = null;
            render();
          }, 1800);
        }
        if (a === 'reveal') S.reveal[el.dataset.id] = !S.reveal[el.dataset.id];
        if (a === 'strip') S.stripOpen[k] = !S.stripOpen[k];
        if (a === 'preview') {
          S.previewOpen = S.previewOpen === k ? null : k;
          S.menu = null;
        }
        if (a === 'menu') {
          S.menu = S.menu === k ? null : k;
          S.previewOpen = null;
        }
        if (a === 'dismiss') S.reminder = false;
        if (a === 'sheet') S.sheet = S.sheet === k ? null : k;
        if (a === 'folder') {
          S.mfolder = el.dataset.f;
          S.sheet = null;
        }
        if (a === 'ureveal') S.uReveal = !S.uReveal;
        if (a === 'spage') {
          S.spage[k] = el.dataset.p || null;
          S.wizard[k] = false;
        }
        if (a === 'wizard') S.wizard[k] = true;
        if (a === 'unwizard') S.wizard[k] = false;
        if (a === 'pwshow') S.pwShow[el.dataset.id] = !S.pwShow[el.dataset.id];
        if (a === 'thm') S.thm = el.dataset.v;
        if (a === 'accent') S.accent = el.dataset.v;
        if (a === 'gen') S.gen[k] = !S.gen[k];
        if (a === 'regen') S.gi++;
        if (a === 'gmode') S.gmode = el.dataset.v;
        if (a === 'usepw') {
          S.gpw[k] = el.dataset.v;
          S.gen[k] = false;
        }
        if (a === 'edshow') S.edShow[k] = !S.edShow[k];
        if (a === 'jshow') S.jShow[el.dataset.id] = !S.jShow[el.dataset.id];
        if (a === 'cnext') S.cstep = S.cstep === 3 ? 1 : S.cstep + 1;
        if (a === 'creset') S.cstep = 1;
        if (a === 'submit') {
          S.uReveal = false;
          S.uErr = true;
        }
        render();
      });
      document.addEventListener('input', (e) => {
        if (e.target.dataset.act === 'pwin') S.uPw = e.target.value;
      });
      addEventListener('resize', fit);
      render();
    </script>

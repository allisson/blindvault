<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Popup sem login para a página</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.bv{--bg:#EEF1F4;--stage:#E2E7ED;--surf:#FFFFFF;--surf2:#F4F6F9;--ink:#17202B;--ink2:#435063;--ink3:#5A6779;--line:#D9DFE6;--warnbg:#FFF2DE;--warn:#874600;--okbg:#E4F4EC;--ok:#156339;--danger:#B42318;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.07);--accs:color-mix(in srgb,var(--acc) 11%,var(--surf));--accl:color-mix(in srgb,var(--acc) 35%,var(--surf));font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);box-sizing:border-box;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.bv *{box-sizing:border-box}
.bv.dark{--bg:#0D1218;--stage:#080B0F;--surf:#151C24;--surf2:#1C252F;--ink:#E8EDF3;--ink2:#B6C0CC;--ink3:#97A2B1;--line:#2A3441;--warnbg:#2B2011;--warn:#F6C177;--okbg:#0F2A1D;--ok:#6BD9A3;--danger:#FF8F80;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--accs:color-mix(in srgb,var(--acc) 16%,var(--surf))}
.acc-teal{--acc:#0F766E;--acc-ink:#FFFFFF}.dark.acc-teal{--acc:#3DD6C4;--acc-ink:#04201C}
.acc-blue{--acc:#2563EB;--acc-ink:#FFFFFF}.dark.acc-blue{--acc:#7AB0FF;--acc-ink:#071833}
.acc-indigo{--acc:#4F46E5;--acc-ink:#FFFFFF}.dark.acc-indigo{--acc:#9C97FF;--acc-ink:#120F3A}
.acc-violet{--acc:#7C3AED;--acc-ink:#FFFFFF}.dark.acc-violet{--acc:#B794FF;--acc-ink:#1E0B40}
.acc-green{--acc:#15803D;--acc-ink:#FFFFFF}.dark.acc-green{--acc:#5EDB8A;--acc-ink:#062512}
.acc-rose{--acc:#BE123C;--acc-ink:#FFFFFF}.dark.acc-rose{--acc:#FF8AA0;--acc-ink:#3A0613}
.bv h1,.bv h2,.bv h3,.bv p{margin:0}
.h1{font-size:30px;font-weight:650;letter-spacing:-.022em;line-height:1.12}
.h2{font-size:21px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.h3{font-size:16px;font-weight:650;line-height:1.3}
.body{font-size:15px;line-height:1.5}
.small{font-size:13px;line-height:1.45}
.t2{color:var(--ink2)}.t3{color:var(--ink3)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:11px;font-family:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.q{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.wide{width:100%}
.btn.dg{color:var(--danger)}
.btn.icon{width:44px;padding:0}
.btn.sm.icon{width:36px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px}
.lbl{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp{display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--line);border-radius:11px;background:var(--surf);padding:0 14px;font-family:inherit;font-size:15px;color:var(--ink);width:100%}
.inp.focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accl)}
.inp input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.acc{background:var(--accs);color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:16px;height:16px}.ico.l{width:24px;height:24px}.ico.xl{width:32px;height:32px}
.tile{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14.5px;font-weight:550;color:var(--ink2);text-decoration:none}
.nav.on{background:var(--surf);color:var(--ink);box-shadow:var(--shadow)}
.nav .n{margin-left:auto;font-size:13px;color:var(--ink3);font-weight:500}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink3)}
.step .c{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.step.on{color:var(--ink)}.step.on .c{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.step.done{color:var(--ink2)}.step.done .c{background:var(--accs);border-color:transparent;color:var(--acc)}
.bar{flex:1;height:2px;background:var(--line);border-radius:2px;min-width:16px}.bar.done{background:var(--acc)}
.qr{background:#fff;border-radius:14px;padding:12px;display:inline-flex;border:1px solid var(--line)}
.win{background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.phone{width:390px;border-radius:46px;border:9px solid #1B222C;background:var(--bg);overflow:hidden;position:relative;box-shadow:var(--shadow)}
.dark .phone{border-color:#2C3542}
.sep{height:1px;background:var(--line)}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.kbd{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line);border-bottom-width:2px;background:var(--surf);font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink2)}
.sw{width:46px;height:28px;border-radius:999px;border:0;padding:3px;background:var(--line);display:inline-flex;cursor:pointer}.sw span{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}.sw.on{background:var(--acc);justify-content:flex-end}
</style>
</helmet>
<div class="{{rootClass}}" style="width: 380px; height: 580px; ">
<div class="col" style="width: 380px; height: 580px; background: var(--bg); overflow: hidden"><div class="row" style="gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line)">
  <span class="tile" style="background: var(--acc); color: var(--acc-ink); width: 28px; height: 28px; border-radius: 8px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.2c0 4.4-3.1 8.2-7.5 9.8-4.4-1.6-7.5-5.4-7.5-9.8V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
  <span style="font-weight: 700; flex: 1">BlindVault</span>
  <button class="btn sm icon q" type="button" aria-label="Abrir o BlindVault"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  <button class="btn sm icon q" type="button" aria-label="Bloquear"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></div><div style="padding: 12px 14px 4px"><div class="inp" style="height: 40px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input type="search" placeholder="Buscar logins" aria-label="Buscar logins"></div></div>
<div class="row small" style="gap: 10px; margin: 8px 14px; padding: 12px; border-radius: 12px; background: var(--surf2); color: var(--ink2); align-items: flex-start"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.4"/></svg><span>Nenhum login corresponde a esta página. Você ainda pode copiar de qualquer login abaixo.</span></div>
<div class="col" style="padding: 4px 6px 0; gap: 2px">
  <div class="row" style="padding: 6px 10px"><span class="small" style="font-weight: 650">Todos os logins</span></div>
  <div class="row" style="gap: 10px; padding: 8px 10px; border-radius: 12px">
  <span class="tile" style="width: 34px; height: 34px; border-radius: 10px; font-size: 14px; background: var(--surf2); color: var(--ink2); border: 1px solid var(--line)">H</span>
  <span class="col" style="flex: 1; min-width: 0; gap: 1px"><span style="font-weight: 600; font-size: 14.5px">Harbor</span><span class="small t2">ana@acme.example</span></span>
  <span class="row" style="gap: 2px"><button class="btn sm icon q" type="button" aria-label="Copiar nome de usuário" style="width: 32px; height: 32px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"/></svg></button><button class="btn sm icon q" type="button" aria-label="Copiar senha" style="width: 32px; height: 32px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.2 2.2M13.8 9.2l2 2"/></svg></button><button class="btn sm icon q" type="button" aria-label="Copiar código" style="width: 32px; height: 32px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button></span></div>
  <div class="row" style="gap: 10px; padding: 8px 10px; border-radius: 12px">
  <span class="tile" style="width: 34px; height: 34px; border-radius: 10px; font-size: 14px; background: var(--surf2); color: var(--ink2); border: 1px solid var(--line)">L</span>
  <span class="col" style="flex: 1; min-width: 0; gap: 1px"><span style="font-weight: 600; font-size: 14.5px">Lantern Mail</span><span class="small t2">rui.costa</span></span>
  <span class="row" style="gap: 2px"><button class="btn sm icon q" type="button" aria-label="Copiar nome de usuário" style="width: 32px; height: 32px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"/></svg></button><button class="btn sm icon q" type="button" aria-label="Copiar senha" style="width: 32px; height: 32px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.2 2.2M13.8 9.2l2 2"/></svg></button></span></div>
  <div class="row" style="gap: 10px; padding: 8px 10px; border-radius: 12px">
  <span class="tile" style="width: 34px; height: 34px; border-radius: 10px; font-size: 14px; background: var(--surf2); color: var(--ink2); border: 1px solid var(--line)">F</span>
  <span class="col" style="flex: 1; min-width: 0; gap: 1px"><span style="font-weight: 600; font-size: 14.5px">Fórum</span><span class="small t2">ana.dev</span></span>
  <span class="row" style="gap: 2px"><button class="btn sm icon q" type="button" aria-label="Copiar nome de usuário" style="width: 32px; height: 32px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"/></svg></button><button class="btn sm icon q" type="button" aria-label="Copiar senha" style="width: 32px; height: 32px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.2 2.2M13.8 9.2l2 2"/></svg></button></span></div>
</div>
<div style="flex: 1"></div>
<div class="row small" style="gap: 10px; margin: 14px; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); align-items: flex-start"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Copiado. O BlindVault tenta limpar a área de transferência em 30 s, mas a limpeza não é garantida.</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema": {"editor": "enum", "options": ["Claro", "Escuro"], "default": "Claro", "section": "Tema"}, "destaque": {"editor": "enum", "options": ["Teal", "Azul", "Índigo", "Violeta", "Verde", "Rosa"], "default": "Teal", "section": "Tema"}, "$preview": {"width": 380, "height": 580}}'>
class Component extends DCLogic {
renderVals() {
const acc = {Teal:'acc-teal',Azul:'acc-blue','Índigo':'acc-indigo',Violeta:'acc-violet',Verde:'acc-green',Rosa:'acc-rose'};
const t = this.props.tema ?? 'Claro';
const a = acc[this.props.destaque ?? 'Teal'] || 'acc-teal';
return { rootClass: 'bv ' + a + (t === 'Escuro' ? ' dark' : '') };
}
}
</script>
</body>
</html>

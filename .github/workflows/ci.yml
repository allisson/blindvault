name: CI

# Pushes to main, and pull requests: a push to a PR branch runs once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage

  reproducible:
    # Two builds of the same commit, from checkouts at different paths and the second under another
    # time zone, locale, umask and SOURCE_DATE_EPOCH, must give the same asset manifest (D189).
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: second/elsewhere
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: first/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: first/.nvmrc
      - name: First build
        working-directory: first
        run: |
          pnpm install --frozen-lockfile
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm --filter @blindvault/web build
      - name: Second build, in another environment
        working-directory: second/elsewhere
        run: |
          umask 0077
          pnpm install --frozen-lockfile
          SOURCE_DATE_EPOCH=1 TZ=Pacific/Kiritimati LANG=C LC_ALL=C pnpm --filter @blindvault/web build
      - name: Compare the asset manifests
        run: |
          diff first/apps/web/dist/asset-manifest.txt second/elsewhere/apps/web/dist/asset-manifest.txt
          (cd first/apps/web/dist && sha256sum -c --quiet asset-manifest.txt)
          hash=$(sha256sum first/apps/web/dist/asset-manifest.txt | cut -d' ' -f1)
          {
            echo "Asset manifest sha256: \`$hash\`"
            echo
            echo '```'
            cat first/apps/web/dist/asset-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  self-hosting:
    # The configurations of deploy/ served by nginx and Caddy in Docker, images pinned by digest in
    # serve.sh (D195): headers, cache, framing, the opener, and the app installed and offline.
    name: Self-hosting (nginx, Caddy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blindvault/web exec playwright install --with-deps chromium
      - run: pnpm --filter @blindvault/web build
      - name: nginx
        working-directory: apps/web
        run: BLINDVAULT_URL=$(e2e/self-hosting/serve.sh nginx) pnpm test:self-hosting
      - name: Caddy
        working-directory: apps/web
        run: BLINDVAULT_URL=$(e2e/self-hosting/serve.sh caddy) pnpm test:self-hosting

  e2e:
    name: Playwright (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blindvault/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

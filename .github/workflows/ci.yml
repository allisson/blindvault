name: CI

# Pushes to main, and pull requests: a push to a PR branch runs once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage

  reproducible:
    # Two builds of the same commit, from checkouts at different paths and the second under another
    # time zone, locale, umask and SOURCE_DATE_EPOCH, must give the same asset manifest (D189).
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: second/elsewhere
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: first/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: first/.nvmrc
      - name: First build
        working-directory: first
        run: |
          pnpm install --frozen-lockfile
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm --filter @blindvault/web build
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm --filter @blindvault/extension build
      - name: Second build, in another environment
        working-directory: second/elsewhere
        run: |
          umask 0077
          pnpm install --frozen-lockfile
          SOURCE_DATE_EPOCH=1 TZ=Pacific/Kiritimati LANG=C LC_ALL=C pnpm --filter @blindvault/web build
          SOURCE_DATE_EPOCH=1 TZ=Pacific/Kiritimati LANG=C LC_ALL=C pnpm --filter @blindvault/extension build
      - name: Compare the asset manifests
        run: |
          diff first/apps/web/dist/asset-manifest.txt second/elsewhere/apps/web/dist/asset-manifest.txt
          # Left out of the manifest, which Pages does not serve (D229).
          diff first/apps/web/dist/_headers second/elsewhere/apps/web/dist/_headers
          (cd first/apps/web/dist && sha256sum -c --quiet asset-manifest.txt)
          hash=$(sha256sum first/apps/web/dist/asset-manifest.txt | cut -d' ' -f1)
          {
            echo "Asset manifest sha256: \`$hash\`"
            echo
            echo '```'
            cat first/apps/web/dist/asset-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compare the extension packages
        # Each archive byte for byte, and its asset manifest against its files (extension.md §2, D285).
        run: |
          for browser in chrome firefox; do
            cmp first/apps/extension/dist/blindvault-$browser-*.zip second/elsewhere/apps/extension/dist/blindvault-$browser-*.zip
            (cd first/apps/extension/dist/$browser && sha256sum -c --quiet asset-manifest.txt)
            hash=$(sha256sum first/apps/extension/dist/$browser/asset-manifest.txt | cut -d' ' -f1)
            echo "Extension ($browser) asset manifest sha256: \`$hash\`" >> "$GITHUB_STEP_SUMMARY"
          done

  android:
    # android.md §2, §13 (D290): the shell's Kotlin unit tests, then the unsigned APK built twice,
    # from checkouts at two paths, the second under another time zone, locale, umask and
    # SOURCE_DATE_EPOCH; the two APKs must be identical byte for byte. No emulator.
    name: Android APK, built twice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: second/elsewhere
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: first/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: first/.nvmrc
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21.0.13+9
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
      - name: First build and the Kotlin unit tests
        working-directory: first
        run: |
          pnpm install --frozen-lockfile
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm --filter @blindvault/android build
          (cd apps/android && ./gradlew --no-daemon test)
      - name: Second build, in another environment
        working-directory: second/elsewhere
        run: |
          umask 0077
          pnpm install --frozen-lockfile
          SOURCE_DATE_EPOCH=1 TZ=Pacific/Kiritimati LANG=C LC_ALL=C pnpm --filter @blindvault/android build
      - name: Compare the APKs
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          cmp first/$apk second/elsewhere/$apk
          (cd first/apps/android/app/src/main/assets/web && sha256sum -c --quiet asset-manifest.txt)
          manifest=$(sha256sum first/apps/android/app/src/main/assets/web/asset-manifest.txt | cut -d' ' -f1)
          echo "Android asset manifest sha256: \`$manifest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned APK sha256: \`$(sha256sum first/$apk | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

  self-hosting:
    # The configurations of deploy/ served by nginx and Caddy in Docker, images pinned by digest in
    # serve.sh (D195): headers, cache, framing, the opener, and the app installed and offline.
    name: Self-hosting (nginx, Caddy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blindvault/web exec playwright install --with-deps chromium
      - run: pnpm --filter @blindvault/web build
      - name: nginx
        working-directory: apps/web
        run: BLINDVAULT_URL=$(e2e/self-hosting/serve.sh nginx) pnpm test:self-hosting
      - name: Caddy
        working-directory: apps/web
        run: BLINDVAULT_URL=$(e2e/self-hosting/serve.sh caddy) pnpm test:self-hosting

  e2e:
    # Four shards of the web suite, each on its own runner: one runner gives Playwright 2 workers,
    # and the suite took 38 minutes there. packages/sync runs on the first shard only.
    name: Playwright (Chromium, Firefox, WebKit), shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # The browsers and their system libraries come in the image, pinned by digest, so no step waits
    # on the runner's apt mirror (it once took 15 minutes). Its tag follows @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard == 1
        run: pnpm --filter @blindvault/sync test:e2e
      # The unpacked extension in Chromium, built first (apps/extension).
      - if: matrix.shard == 1
        run: pnpm --filter @blindvault/extension test:e2e
      - run: pnpm --filter @blindvault/web test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/extension/playwright-report/
            packages/sync/playwright-report/
          retention-days: 7

name: Release

# A tag v<version> builds once. That build becomes the GitHub Release and, from the release's
# attested archive, the Cloudflare Pages deployment at the dedicated origin (D90, D228, D230); the
# served files are then checked against the release (D194). No push to main deploys anything: an
# installed copy takes an update only after confirmation (D63, D191). The cloudflare-pages
# environment allows only v* tags and holds CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ORIGIN,
# the origin the check reads (docs/deployment.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: the release installs from the lockfile alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm --filter @blindvault/web build
      - name: Compare sw.js with the previous release
        id: worker
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            change=first
          elif git diff --quiet "$previous" "$GITHUB_REF_NAME" -- apps/web/public/sw.js; then
            change=unchanged
          else
            change=changed
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "change=$change" >> "$GITHUB_OUTPUT"
      - name: Check the tag and the notes, and write the release body
        id: body
        env:
          CHANGE: ${{ steps.worker.outputs.change }}
          PREVIOUS: ${{ steps.worker.outputs.previous }}
        run: >-
          node apps/web/build/release.ts "$GITHUB_REF_NAME" apps/web/dist docs/releases "$CHANGE"
          "$PREVIOUS" > "$RUNNER_TEMP/release-body.md"
      - name: Collect the release files
        run: |
          mkdir "$RUNNER_TEMP/release"
          cp apps/web/dist/asset-manifest.txt apps/web/dist/sw.js "$RUNNER_TEMP/release/"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            --mode=u=rwX,go=rX \
            -C apps/web/dist -cf - . | gzip -n > "$RUNNER_TEMP/release/blindvault-${GITHUB_REF_NAME}.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.body.outputs.prerelease }}
          VERSION: ${{ steps.body.outputs.version }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "BlindVault $VERSION" --notes-file "$RUNNER_TEMP/release-body.md" "${flags[@]}" \
            "$RUNNER_TEMP"/release/*

  deploy:
    # What goes live is the release's archive, once its attestation checks (D230).
    name: Deploy to Cloudflare Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    environment:
      name: cloudflare-pages
      url: ${{ vars.ORIGIN }}
    outputs:
      origin: ${{ steps.origin.outputs.origin }}
    steps:
      - name: Check the origin
        id: origin
        env:
          ORIGIN: ${{ vars.ORIGIN }}
        run: |
          case "$ORIGIN" in
            https://blindvault.allisson.dev | https://blindvault.pages.dev) ;;
            *) echo "::error::ORIGIN of the cloudflare-pages environment is '$ORIGIN'"; exit 1 ;;
          esac
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
      - name: Download the release archive and check its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="blindvault-${GITHUB_REF_NAME}.tar.gz"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP" \
            --pattern "$archive"
          gh attestation verify "$RUNNER_TEMP/$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          # wrangler installs into its own directory, so nothing but the archive is uploaded.
          mkdir site wrangler
          tar -xzf "$RUNNER_TEMP/$archive" -C site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          packageManager: npm
          workingDirectory: wrangler
          command: >-
            pages deploy ../site --project-name=blindvault --branch=main
            --commit-hash=${{ github.sha }} --commit-message=${{ github.ref_name }}

  verify:
    # The hash the About screen shows is the served manifest's (D192); this checks that the served
    # manifest, sw.js and every listed file are the release's.
    name: Check the served files against the release
    needs: deploy
    runs-on: ubuntu-latest
    env:
      ORIGIN: ${{ needs.deploy.outputs.origin }}
    steps:
      - name: Download the release's manifest and sw.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir released
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir released \
            --pattern asset-manifest.txt --pattern sw.js
      - name: Compare the served files
        run: |
          mkdir served
          cd served
          # The CDN may serve the previous deployment for a while. Pages redirects /index.html to /
          # and /404.html to /404, so every request follows redirects, over HTTPS only (D228).
          for attempt in $(seq 1 20); do
            curl -fsSL --proto '=https' --proto-redir '=https' "$ORIGIN/asset-manifest.txt?run=$GITHUB_RUN_ID-$attempt" \
              -o asset-manifest.txt || true
            if cmp -s asset-manifest.txt ../released/asset-manifest.txt; then break; fi
            sleep 30
          done
          cmp asset-manifest.txt ../released/asset-manifest.txt
          curl -fsSL --proto '=https' --proto-redir '=https' "$ORIGIN/sw.js?run=$GITHUB_RUN_ID" -o sw.js
          cmp sw.js ../released/sw.js
          # The manifest is the release's, so its paths are trusted.
          while read -r _ path; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL --proto '=https' --proto-redir '=https' "$ORIGIN/$path?run=$GITHUB_RUN_ID" -o "$path"
          done < asset-manifest.txt
          sha256sum -c --quiet asset-manifest.txt
          echo "Served at $ORIGIN: asset manifest sha256 \`$(sha256sum asset-manifest.txt | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

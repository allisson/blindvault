name: Spikes (GitHub Pages)

# Phase 0 risk spikes only (docs/spikes/README.md). Each run redeploys the spike site; changing
# swVersion produces a changed sw.js for the service-worker spike (D63, D142).
on:
  workflow_dispatch:
    inputs:
      swVersion:
        description: Service-worker version string baked into sw.js
        required: true
        default: '1'
      swTakeover:
        description: New service worker calls skipWaiting and clients.claim
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: spikes-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blindvault/spikes build
        env:
          SPIKE_BASE: /${{ github.event.repository.name }}/
          SW_VERSION: ${{ inputs.swVersion }}
          SW_TAKEOVER: ${{ inputs.swTakeover }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: spikes/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

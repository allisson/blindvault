# BlindVault on nginx (docs/self-hosting.md, D90, D195).
#
# Include this file in the server block of an origin that serves nothing else, after its listen
# and TLS lines. The files of a release go in /srv/blindvault. No location below uses add_header,
# so every one of them inherits these headers.

root /srv/blindvault;
index index.html;
server_tokens off;

# The policy of the <meta> tag, with frame-ancestors, which <meta> cannot set (D83, D193).
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
# A page that opens the app keeps no handle on its window (D195).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# Files under assets/ change name with their content; every other file is checked at every load,
# sw.js and asset-manifest.txt above all, so an update is seen (D63, D191).
location /assets/ {
    expires max;
    try_files $uri =404;
}

# nginx's mime.types has no type for the web app manifest.
location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
}

location / {
    expires -1;
    # $uri/ serves index.html for /. No other path falls back to it: the app has no routes (D167).
    try_files $uri $uri/ =404;
}
